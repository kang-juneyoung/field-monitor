<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Monitor</title>
<!-- 외부 CDN 없음: Leaflet을 로컬에 포함 (폐쇄망 동작) -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<script src="/static/vendor/leaflet/leaflet.js"></script>
<style>
  :root { --ink: #1d2330; --muted: #6b7280; --line: #e3e6eb; --ok: #1f8a4c; --bad: #c53030; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", system-ui, sans-serif; color: var(--ink); }
  #app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  #map { background: #cfe3f2; }
  aside { border-left: 1px solid var(--line); display: flex; flex-direction: column; background: #fff; overflow: hidden; }
  aside header { padding: 12px 14px; background: #1d2330; color: #fff; }
  aside header h1 { margin: 0; font-size: 15px; }
  aside header .sub { font-size: 11px; color: #aab2c0; margin-top: 2px; }
  .banner { font-size: 12px; padding: 7px 14px; background: #fffaf0; border-bottom: 1px solid #fbd38d; }
  .banner.ok { background: #f0fff4; border-color: #9ae6b4; }
  .rec { font-size: 11px; color: var(--muted); padding: 5px 14px; border-bottom: 1px solid var(--line); }
  .rec b { color: var(--bad); }
  h2 { font-size: 12px; color: var(--muted); margin: 12px 14px 6px; letter-spacing: .4px; }
  .unit { margin: 0 10px 8px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px; }
  .unit.lost { background: #fff5f5; border-color: #feb2b2; }
  .unit .row { display: flex; justify-content: space-between; align-items: center; }
  .unit .name { font-weight: 700; }
  .src { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; color: #fff; background: #2b6cb0; }
  .src.TCP { background: #6b46c1; } .src.SERIAL { background: #b7791f; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .lost .state { color: var(--bad); font-weight: 700; }
  .list { overflow: auto; font-size: 12px; padding: 0 14px; }
  #events { flex: 1; }
  #errors { max-height: 110px; color: var(--muted); padding-bottom: 10px; }
  .list div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .list time { color: var(--muted); margin-right: 6px; }
  .bad { color: var(--bad); font-weight: 700; } .ok { color: var(--ok); font-weight: 700; }
  .chips span { display: inline-block; font-size: 11px; border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; margin-left: 4px; color: var(--ink); }
  .arrow svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
  .lbl { background: rgba(29,35,48,.85); color: #fff; border: 0; font-size: 11px; padding: 1px 5px; box-shadow: none; }
  .lbl:before { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside>
    <header>
      <h1>현장 장비 위치 관제</h1>
      <div class="sub">시리얼 · UDP · TCP 수신 → 오프라인 지도 (개인 포트폴리오 · 시뮬레이션)</div>
    </header>
    <div id="tiles" class="banner">지도 타일 확인 중...</div>
    <div id="rec" class="rec"></div>
    <h2>장비 <span id="count"></span></h2>
    <div id="units"></div>
    <h2>이벤트 (최초 수신 · 두절 · 복구)</h2>
    <div id="events" class="list"></div>
    <h2>프레임 오류 <span id="bad" class="chips"></span></h2>
    <div id="errors" class="list"></div>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmmss = (ts) => new Date(ts * 1000).toLocaleTimeString("ko-KR", {hour12: false});
const map = L.map("map", {zoomControl: true}).setView([37.3915, 126.6450], 14);
L.control.scale({imperial: false}).addTo(map);

// 타일이 없을 때도 위치 관계를 볼 수 있도록 위경도 격자를 직접 그린다 (외부 요청 없음)
const Grid = L.GridLayer.extend({
  createTile(coords) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    g.fillStyle = "#eef1f4"; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = "#d3d9e0"; g.strokeRect(0, 0, 256, 256);
    const nw = map.unproject([coords.x * 256, coords.y * 256], coords.z);
    g.fillStyle = "#98a2b3"; g.font = "10px sans-serif";
    g.fillText(`${nw.lat.toFixed(4)}, ${nw.lng.toFixed(4)}`, 4, 12);
    return c;
  }
});

fetch("/api/tiles/info").then((r) => r.json()).then((info) => {
  if (info.available) {
    L.tileLayer("/tiles/{z}/{x}/{y}.png", {maxZoom: 18, minZoom: +info.minzoom || 0,
      maxNativeZoom: +info.maxzoom || 16, attribution: esc(info.attribution || "")}).addTo(map);
    $("tiles").className = "banner ok";
    $("tiles").textContent = `오프라인 지도: ${info.name || "MBTiles"} (줌 ${info.minzoom}~${info.maxzoom}) · 인터넷 불필요`;
  } else {
    new Grid().addTo(map);
    $("tiles").textContent = "MBTiles 없음 → 위경도 격자로 표시 중";
  }
});
fetch("/api/record").then((r) => r.json()).then((r) => {
  $("rec").innerHTML = r.recording ? `<b>● 기록 중</b> ${esc(r.path)} (tools/replay.py로 재생)` : "수신 기록 꺼짐";
});

const markers = {}, tracks = {};
let first = true;
function arrowIcon(hdg, online) {
  const color = online ? "#1f8a4c" : "#c53030";
  return L.divIcon({className: "arrow", iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<svg viewBox="0 0 24 24" style="transform:rotate(${hdg}deg)"><path d="M12 2 L20 21 L12 16 L4 21 Z" fill="${color}" stroke="#fff" stroke-width="1.5"/></svg>`});
}

function render(d) {
  $("count").textContent = `(${d.units.length})`;
  $("bad").innerHTML = Object.entries(d.bad_by_source).map(([k, v]) => `<span>${esc(k)} ${v}</span>`).join("");
  for (const u of d.units) {
    const ll = [u.lat, u.lon];
    if (!markers[u.unit]) {
      markers[u.unit] = L.marker(ll).addTo(map).bindTooltip(u.unit, {permanent: true, direction: "right", className: "lbl", offset: [10, 0]});
      tracks[u.unit] = L.polyline([], {weight: 3, opacity: .7}).addTo(map);
    }
    markers[u.unit].setLatLng(ll).setIcon(arrowIcon(u.heading, u.online));
    tracks[u.unit].setLatLngs(u.track).setStyle({color: u.online ? "#2b6cb0" : "#c53030", dashArray: u.online ? null : "4 4"});
  }
  if (first && d.units.length) { map.fitBounds(L.latLngBounds(d.units.map((u) => [u.lat, u.lon])).pad(0.6), {maxZoom: 13}); first = false; }

  $("units").innerHTML = d.units.map((u) => `
    <div class="unit ${u.online ? "" : "lost"}" onclick="map.panTo([${u.lat},${u.lon}])">
      <div class="row"><span class="name">${esc(u.unit)}</span><span class="src ${esc(u.source)}">${esc(u.source)}</span></div>
      <div class="meta">${u.lat.toFixed(5)}, ${u.lon.toFixed(5)} · ${u.speed.toFixed(1)} km/h · ${u.heading.toFixed(0)}°</div>
      <div class="meta"><span class="state">${u.online ? "정상" : "통신 두절"}</span> · ${Math.max(0, d.ts - u.last_seen).toFixed(0)}초 전 · 수신 ${u.frames}건</div>
    </div>`).join("") || `<div class="meta" style="margin:0 14px">수신된 장비 없음. python -m sim.devices 를 실행하세요.</div>`;

  $("events").innerHTML = d.events.map((e) =>
    `<div><time>${hhmmss(e.ts)}</time><span class="${e.level === "info" ? "" : e.level}">${esc(e.msg)}</span></div>`).join("");
  $("errors").innerHTML = d.errors.map((e) =>
    `<div><time>${hhmmss(e.ts)}</time>[${esc(e.source)}] ${esc(e.msg)}</div>`).join("");
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = (m) => render(JSON.parse(m.data));
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
</body>
</html>
